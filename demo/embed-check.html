<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>埋め込み確認用(ローカル)</title>
  <style>
    body { margin: 0; padding: 16px; font-family: system-ui, sans-serif; background: #f5f5f7; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    p { font-size: 14px; color: #444; line-height: 1.6; max-width: 640px; }
  </style>
</head>
<body>
  <h1>埋め込み確認用(ローカル)</h1>
  <p>これは `?embed=1`(埋め込み表示)をローカルで目視確認するためのページです。</p>
  <p>iframe の高さが中身に合わせて伸びるか、検索欄・エリアチップ・戻るボタンが消えているかを見ます。</p>
  <p>本番の営業用デモは <code>hotel-page.html</code> です。</p>
  <iframe src="../index.html?embed=1&fixture=kusatsu" title="やどたび"
    style="width:100%;max-width:420px;height:720px;border:1px solid #ddd"></iframe>
</body>
</html>

<noscript>
  <div style="max-width:480px;margin:10vh auto;padding:24px;text-align:center;font-family:sans-serif;color:#222;line-height:1.7;">
    <h1 style="font-size:1.5rem;margin-bottom:1em;">やどたび</h1>
    <p style="margin-bottom:1em;">このページは JavaScript で動きます。ブラウザの JavaScript を有効にして、再読み込みしてください。</p>
    <p style="margin-bottom:1em;">やどたびは、宿を選ぶだけで、まわりの見どころが並ぶ旅行サイトです。入力は不要で、宿の名前やエリアを選ぶと、歩いて行ける観光地やお店が自動で表示されます。</p>
    <p style="margin-bottom:1em;">JavaScript を有効にしたブラウザで、下のリンクからもう一度お試しください。</p>

<!-- ===== 状態A: 選ぶ ===== -->
<section class="view view--select" id="view-select">
  <header class="pickbar">
    <div class="pickbar__row">
      <span class="pickbar__brand" aria-hidden="true">🧳</span>
      <div class="pickbar__search">
        <input class="input pickbar__input" id="search-input" type="text"
          placeholder="ホテル名・旅館名・エリア" inputmode="search" autocomplete="off"
          aria-label="宿を検索" aria-autocomplete="list" aria-controls="suggest-list">
        <button type="button" class="pickbar__clear" id="search-clear" aria-label="検索欄を空にする" hidden>×</button>
        <div class="suggest" id="suggest-list" role="listbox" hidden></div>
      </div>
    </div>
    <div class="chips" id="area-chips" role="group" aria-label="エリアから探す"></div>
    <p class="pickbar__lead" id="pickbar-lead" hidden>宿を選ぶと、まわりの見どころが並びます。</p>
    <div class="samples" id="sample-links" hidden></div>
  </header>

  <div class="mapwrap">
    <div id="map" class="mapwrap__map" role="region" aria-label="宿をさがす地図"></div>
    <div class="mapnote" id="map-note" hidden></div>
  </div>
</section>

<!-- ===== 状態B: 見る ===== -->
<section class="view view--feed" id="view-feed" hidden>
  <header class="topbar">
    <button class="topbar__back" id="back-btn" type="button" aria-label="地図に戻る">←</button>
    <h1 class="topbar__title" id="feed-title"></h1>
    <span class="topbar__badge" id="feed-badge" hidden>固定データ<span class="topbar__badge__date" id="feed-badge-date" hidden></span></span>
  </header>

  <div id="feed-map" class="feedmap" role="region" aria-label="周辺の地図"></div>

  <p class="feedstatus" id="feed-status" role="status" aria-live="polite" hidden></p>

  <p class="feedorigin" id="feed-origin" hidden></p>

  <div class="feed" id="feed-list"></div>

  <div id="feed-more" hidden></div>

  <div id="feed-far" hidden></div>

  <div id="feed-note" hidden></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"

<script src="assets/engine.js"></script>
<script src="assets/app.js"></script>

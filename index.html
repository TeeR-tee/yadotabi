<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>やどたび - 宿を選ぶだけ</title>
  <meta name="description" content="宿を選ぶだけで、まわりの見どころが並びます。入力は不要。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="やどたび">
  <meta property="og:title" content="やどたび - 宿を選ぶだけ">
  <meta property="og:description" content="宿を選ぶだけで、まわりの見どころが並びます。入力は不要。">
  <meta property="og:url" content="https://teer-tee.github.io/yadotabi/">
  <meta property="og:image" content="https://teer-tee.github.io/yadotabi/docs/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="やどたびの画面。宿のまわりの見どころが地図とカードで並ぶ">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="やどたび - 宿を選ぶだけ">
  <meta name="twitter:description" content="宿を選ぶだけで、まわりの見どころが並びます。入力は不要。">
  <meta name="twitter:image" content="https://teer-tee.github.io/yadotabi/docs/og.jpg">
  <link rel="canonical" href="https://teer-tee.github.io/yadotabi/">
  <link rel="stylesheet" href="assets/tokens.css">
  <link rel="stylesheet" href="assets/ui.css">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
</head>
<body>

<!-- ===== 状態A: 選ぶ ===== -->
<section class="view view--select" id="view-select">
  <header class="pickbar">
    <div class="pickbar__row">
      <span class="pickbar__brand" aria-hidden="true">🧳</span>
      <div class="pickbar__search">
        <input class="input pickbar__input" id="search-input" type="text"
          placeholder="ホテル名・旅館名・エリア" inputmode="search" autocomplete="off"
          aria-label="宿を検索" aria-autocomplete="list" aria-controls="suggest-list">
        <div class="suggest" id="suggest-list" role="listbox" hidden></div>
      </div>
    </div>
    <div class="chips" id="area-chips" role="group" aria-label="エリアから探す"></div>
  </header>

  <div class="mapwrap">
    <div id="map" class="mapwrap__map"></div>
    <div class="mapnote" id="map-note" hidden></div>
  </div>
</section>

<!-- ===== 状態B: 見る ===== -->
<section class="view view--feed" id="view-feed" hidden>
  <header class="topbar">
    <button class="topbar__back" id="back-btn" type="button" aria-label="地図に戻る">←</button>
    <h1 class="topbar__title" id="feed-title"></h1>
  </header>

  <div id="feed-map" class="feedmap"></div>

  <p class="feedstatus" id="feed-status" hidden></p>

  <div class="feed" id="feed-list"></div>

  <div id="feed-far" hidden></div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="assets/geo.js"></script>
<script src="assets/engine.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
